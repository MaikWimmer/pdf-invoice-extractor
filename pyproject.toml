[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extractor"
version = "0.1.0"
description = "Turn invoice PDFs into a structured Excel workbook - without guessing"
requires-python = ">=3.9"
dependencies = ["pdfplumber>=0.11", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["invoice_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
